<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Booking Confirmed - Eventify</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<section class="confirmation">

    <div class="confirmation-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>Booking Confirmed!</h1>

        <p>
            Your tickets have been successfully booked.
        </p>

        <div class="ticket">

            <div>
                <span>BOOKING ID</span>
                <strong id="bookingId">EVT000000</strong>
            </div>

            <div>
                <span>NAME</span>
                <strong id="bookingName">Guest</strong>
            </div>

            <div>
                <span>EVENT</span>
                <strong id="bookingEvent">Event</strong>
            </div>

            <div>
                <span>TICKETS</span>
                <strong id="bookingTickets">1</strong>
            </div>

            <div>
                <span>TOTAL</span>
                <strong>₹<span id="bookingTotal">0</span></strong>
            </div>

        </div>

        <a href="events.html" class="btn">
            Explore More Events
        </a>

        <button
            class="print-btn"
            onclick="window.print()">
            🖨 Print Ticket
        </button>

    </div>

</section>

<script>

const booking =
    JSON.parse(localStorage.getItem("booking"));

if (booking) {

    document.getElementById("bookingId")
        .textContent = booking.id;

    document.getElementById("bookingName")
        .textContent = booking.name;

    document.getElementById("bookingEvent")
        .textContent = booking.event;

    document.getElementById("bookingTickets")
        .textContent = booking.tickets;

    document.getElementById("bookingTotal")
        .textContent = booking.total;

}

</script>

</body>
</html>
